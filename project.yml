name: QotaFolio
options:
  bundleIdPrefix: net.c2coast
  deploymentTarget: { macOS: "26.0" }
  createIntermediateGroups: true
  # An Icon Composer package is one file to Xcode; without this, xcodegen expands
  # its contents and the build no longer recognises an icon in it.
  fileTypes:
    icon: { file: true }
configs:
  Debug: debug
  Release: release
packages:
  QotaFolioCore: { path: . }
  Sparkle: { url: https://github.com/sparkle-project/Sparkle, exactVersion: 2.9.4 }
settings:
  base:
    DEVELOPMENT_TEAM: NCCKY76LD4
    CODE_SIGN_STYLE: Automatic
    # The one identifier everything else is derived from. The app IS this string; the `qota`
    # tool is `.qota` and the `QotaFolioKit` framework is `.Kit`, and `AppIdentity` derives the
    # support folder, the App Group, the Keychain service, the defaults domain and the lease from
    # the app's. A private build sets it on the xcodebuild line
    # (`QOTAFOLIO_BUNDLE_ID=net.c2coast.QotaFolio.dev.mine`) and gets its own everything.
    #
    # It is not `PRODUCT_BUNDLE_IDENTIFIER` on purpose: a setting given on the command line
    # applies to every target in the build, and the tool and the framework need identifiers of
    # their own. This knob fans out into three distinct identifiers instead of one.
    QOTAFOLIO_BUNDLE_ID: net.c2coast.QotaFolio
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "120"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
  configs:
    Debug:
      # A development build is a different app to macOS, and that is the whole point. One
      # identifier here gives a Debug build its own support folder, its own defaults, its own
      # Keychain service and its own App Group -- and makes it impossible for a developer's
      # build to read, write or delete the installed app's data. Its tool and its framework
      # follow, because they derive from the same string.
      QOTAFOLIO_BUNDLE_ID: net.c2coast.QotaFolio.dev
    Release:
      LD_GENERATE_MAP_FILE: "YES"
targets:
  QotaFolioKit:
    type: framework
    platform: macOS
    sources: [Sources/QotaFolioKit]
    dependencies:
      # XcodeGen does not link a static library into a framework unless it is asked.
      - { target: Kit, link: true }
      - { package: QotaFolioCore, product: QotaFolioCoreXcode }
      - { package: Sparkle, product: Sparkle }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QOTAFOLIO_BUNDLE_ID).Kit
        ENABLE_HARDENED_RUNTIME: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        LM_SKIP_METADATA_EXTRACTION: "YES"

  QotaFolioCoreFixtures:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/UIFixtures
        excludes: [Kit]
    dependencies:
      - { package: QotaFolioCore, product: QotaFolioCoreXcode }
    settings:
      base:
        PRODUCT_MODULE_NAME: UIFixtures
        PRODUCT_NAME: QotaFolioCoreFixtures
        SKIP_INSTALL: "YES"

  QotaFolioKitFixtures:
    type: library.static
    platform: macOS
    sources: [Sources/UIFixtures/Kit]
    dependencies:
      - { target: QotaFolioKit }
      - { package: QotaFolioCore, product: QotaFolioCoreXcode }
    settings:
      base:
        SKIP_INSTALL: "YES"

  # `qota`: the terminal command. Reads the three group files by path and the hidden accounts
  # from the app's preferences domain, links the Model target statically, and ships inside the
  # app at Contents/MacOS/qota. No daemon, no socket, no network, never a token.
  qota:
    type: tool
    platform: macOS
    sources:
      - Sources/Qota
      - path: app/settings/hidden
        excludes: ["tests/**"]
    dependencies:
      - { package: QotaFolioCore, product: QotaFolioModel }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QOTAFOLIO_BUNDLE_ID).qota
        PRODUCT_NAME: qota
        ENABLE_HARDENED_RUNTIME: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  QotaFolio:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - path: app/lease
        excludes: ["tests/**"]
      - path: app/settings/legacy
        excludes: ["tests/**"]
      - path: app/settings/hidden
        excludes: ["tests/**"]
      - Assets/Assets.xcassets
      # The macOS 26 layered icon (Icon Composer format), authored by hand from
      # Assets/BrandSources: the Time Fold on the brand ground, three glass layers.
      # It replaces the flat appiconset; Xcode derives the fallback images from it.
      - { path: Assets/AppIcon.icon, buildPhase: resources }
    dependencies:
      - { target: QotaFolioKit, embed: true }
      - { package: QotaFolioCore, product: QotaFolioCoreXcode, embed: true }
      - { target: qota, embed: true, copy: { destination: executables } }
      - { target: QotaFolioCoreFixtures, link: false }
      - { target: QotaFolioKitFixtures, link: false }
      - { package: Sparkle, product: Sparkle, link: false }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QOTAFOLIO_BUNDLE_ID)
        PRODUCT_NAME: QotaFolio
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: app/main/QotaFolio.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # The app declares no App Intents, so there is no metadata to extract.
        LM_SKIP_METADATA_EXTRACTION: "YES"
        LD_ADDITIONAL_DEPLOYMENT_TARGET_FLAGS:
          - -Xlinker
          - -rpath
          - -Xlinker
          - "@executable_path/../Frameworks"
        LD_RUNPATH_SEARCH_PATHS: []
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        QOTAFOLIO_RELEASE_BASE_URL: "https://github.com/c2coast/QotaFolio/releases"
      configs:
        Debug:
          # The Debug identifier itself lives at the project level (`QOTAFOLIO_BUNDLE_ID`), so
          # the tool and the framework follow it. CFBundleIdentifier and the App Group
          # interpolate PRODUCT_BUNDLE_IDENTIFIER, which is that string here.
          #
          # A Debug build carries the fixture lab (`FixtureAppRuntime`), which imports both
          # fixture slices, so both archives are linked here. They are dependencies with
          # `link: false` above, which keeps them out of a Release build entirely.
          OTHER_LDFLAGS:
            - "$(inherited)"
            - "$(BUILT_PRODUCTS_DIR)/libQotaFolioKitFixtures.a"
            - "$(BUILT_PRODUCTS_DIR)/libQotaFolioCoreFixtures.a"
    postBuildScripts:
      - name: Embed, Prune, and Sign Sparkle.framework
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Headers"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Modules"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/PrivateHeaders"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Resources"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Updater.app"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Autoupdate"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Sparkle"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/Current"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/Headers"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/Modules"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/PrivateHeaders"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/Resources"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/Updater.app"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/_CodeSignature"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/Autoupdate"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/Sparkle"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/_CodeSignature/CodeResources"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/PrivateHeaders/SPUAppcastItemStateResolver.h"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/PrivateHeaders/SPUGentleUserDriverReminders.h"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/PrivateHeaders/SPUInstallationType.h"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/PrivateHeaders/SPUStandardUserDriver+Private.h"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/PrivateHeaders/SPUUserAgent+Private.h"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/PrivateHeaders/SUAppcastItem+Private.h"
