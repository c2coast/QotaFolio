name: QotaFolio
options:
  bundleIdPrefix: net.c2coast
  deploymentTarget: { macOS: "26.0" }
  createIntermediateGroups: true
  # An Icon Composer package is one file to Xcode; without this, xcodegen expands
  # its contents and the build no longer recognises an icon in it.
  fileTypes:
    icon: { file: true }
configs:
  Debug: debug
  Release: release
packages:
  QotaFolioCore: { path: . }
  Sparkle: { url: https://github.com/sparkle-project/Sparkle, exactVersion: 2.9.4 }
settings:
  base:
    DEVELOPMENT_TEAM: NCCKY76LD4
    CODE_SIGN_STYLE: Automatic
    # The one identifier everything else is derived from. The app IS this string; the widget
    # extension is `.Widgets`, the `qota` tool is `.qota`, the Kit framework is `.Kit`, and
    # `AppIdentity` derives the container, the App Group, the Keychain service, the defaults
    # domain and the lease from the app's. A private build sets it on the xcodebuild line
    # (`QOTAFOLIO_BUNDLE_ID=net.c2coast.QotaFolio.dev.mine`) and gets its own everything.
    #
    # It is not `PRODUCT_BUNDLE_IDENTIFIER` on purpose: a setting given on the command line
    # applies to every target in the build, and an extension whose identifier equals its host's
    # does not register. This knob fans out into three distinct identifiers instead of one.
    QOTAFOLIO_BUNDLE_ID: net.c2coast.QotaFolio
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "100"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
  configs:
    Debug:
      # A development build is a different app to macOS, and that is the whole point. One
      # identifier here gives a Debug build its own container, its own defaults, its own
      # Keychain service and its own App Group -- and makes it impossible for a developer's
      # build to read, write or delete the installed app's data. Its extension and its tool
      # follow, because they derive from the same string.
      QOTAFOLIO_BUNDLE_ID: net.c2coast.QotaFolio.dev
    Release:
      LD_GENERATE_MAP_FILE: "YES"
targets:
  QotaFolioKit:
    type: framework
    platform: macOS
    sources: [Sources/QotaFolioKit]
    dependencies:
      - { package: QotaFolioCore, product: QotaFolioCoreXcode }
      - { package: Sparkle, product: Sparkle }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QOTAFOLIO_BUNDLE_ID).Kit
        ENABLE_HARDENED_RUNTIME: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        LM_SKIP_METADATA_EXTRACTION: "YES"

  QotaFolioCoreFixtures:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/UIFixtures
        excludes: [Kit]
    dependencies:
      - { package: QotaFolioCore, product: QotaFolioCoreXcode }
    settings:
      base:
        PRODUCT_MODULE_NAME: UIFixtures
        PRODUCT_NAME: QotaFolioCoreFixtures
        SKIP_INSTALL: "YES"

  QotaFolioKitFixtures:
    type: library.static
    platform: macOS
    sources: [Sources/UIFixtures/Kit]
    dependencies:
      - { target: QotaFolioKit }
      - { package: QotaFolioCore, product: QotaFolioCoreXcode }
    settings:
      base:
        SKIP_INSTALL: "YES"

  # The widget extension: the menu-bar / Control Center Control and the desktop widget. It links
  # the Model target and never Core -- Core's main-actor default isolation makes every
  # synthesized Codable main-actor-isolated, and an extension decoding on its own queue cannot
  # use one. It reads the App Group files the app writes and draws them.
  # `Sources/Surfaces` is compiled into it AND into the app: the account entity, the intent that
  # opens the app, the ring -- two processes, one source, no framework between them.
  QotaFolioWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QotaFolioWidgets
        excludes: [Info.plist, "*.entitlements"]
      - Sources/Surfaces
    dependencies:
      - { package: QotaFolioCore, product: QotaFolioModel }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QOTAFOLIO_BUNDLE_ID).Widgets
        PRODUCT_NAME: QotaFolioWidgets
        INFOPLIST_FILE: Sources/QotaFolioWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/QotaFolioWidgets/QotaFolioWidgets.entitlements
        ENABLE_APP_SANDBOX: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        SKIP_INSTALL: "YES"
        # WidgetKit's providers and App Intents are nonisolated protocols; the extension
        # compiles without a default actor so their witnesses are what the protocols ask for.
        # Every type in `Sources/Surfaces` spells its isolation out, because the same file is
        # compiled into the app, which keeps the main-actor default.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # `qota`: the terminal command. Reads the three group files by path from outside the sandbox
  # (that is the day-one check it exists to make), links the Model target statically, and ships
  # inside the app at Contents/MacOS/qota. No daemon, no socket, no network, never a token.
  qota:
    type: tool
    platform: macOS
    sources: [Sources/Qota]
    dependencies:
      - { package: QotaFolioCore, product: QotaFolioModel }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QOTAFOLIO_BUNDLE_ID).qota
        PRODUCT_NAME: qota
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_APP_SANDBOX: "NO"
        SKIP_INSTALL: "YES"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  QotaFolio:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - Sources/Surfaces
      - Assets/Assets.xcassets
      # The macOS 26 layered icon (Icon Composer format), authored by hand from
      # Assets/BrandSources: the Time Fold on the brand ground, three glass layers.
      # It replaces the flat appiconset; Xcode derives the fallback images from it.
      - { path: Assets/AppIcon.icon, buildPhase: resources }
    dependencies:
      - { target: QotaFolioKit, embed: true }
      - { package: QotaFolioCore, product: QotaFolioCoreXcode, embed: true }
      - { target: QotaFolioWidgets, embed: true }
      - { target: qota, embed: true, copy: { destination: executables } }
      - { target: QotaFolioCoreFixtures, link: false }
      - { target: QotaFolioKitFixtures, link: false }
      - { package: Sparkle, product: Sparkle, link: false }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QOTAFOLIO_BUNDLE_ID)
        PRODUCT_NAME: QotaFolio
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/QotaFolio.entitlements
        ENABLE_APP_SANDBOX: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # Deliberately NOT skipping App Intents metadata extraction here: the app carries the
        # intents Spotlight and the Control perform (Sources/Surfaces), and the processor is
        # what registers them.
        LD_ADDITIONAL_DEPLOYMENT_TARGET_FLAGS:
          - -Xlinker
          - -rpath
          - -Xlinker
          - "@executable_path/../Frameworks"
        LD_RUNPATH_SEARCH_PATHS: []
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        QOTAFOLIO_RELEASE_BASE_URL: "https://github.com/c2coast/QotaFolio/releases"
      configs:
        Debug:
          # The Debug identifier itself lives at the project level (`QOTAFOLIO_BUNDLE_ID`), so
          # the extension and the tool follow it. CFBundleIdentifier and the two Sparkle
          # mach-lookup names interpolate PRODUCT_BUNDLE_IDENTIFIER, which is that string here.
          #
          # A Debug build carries the fixture lab (`FixtureAppRuntime`), which imports both
          # fixture slices, so both archives are linked here. They are dependencies with
          # `link: false` above, which keeps them out of a Release build entirely.
          OTHER_LDFLAGS:
            - "$(inherited)"
            - "$(BUILT_PRODUCTS_DIR)/libQotaFolioKitFixtures.a"
            - "$(BUILT_PRODUCTS_DIR)/libQotaFolioCoreFixtures.a"
    postBuildScripts:
      - name: Embed, Prune, and Sign Sparkle.framework
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Headers"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Modules"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/PrivateHeaders"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Resources"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Updater.app"
