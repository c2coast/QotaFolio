          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/XPCServices/Installer.xpc/Contents/_CodeSignature"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/XPCServices/Installer.xpc/Contents/Info.plist"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/XPCServices/Installer.xpc/Contents/_CodeSignature/CodeResources"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/XPCServices/Installer.xpc/Contents/MacOS/Installer"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/Modules/module.modulemap"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/Modules/module.private.modulemap"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework"
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/Current"
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/Current/Sparkle"
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/Current/Autoupdate"
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/Current/Updater.app"
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/Current/Updater.app/Contents/MacOS/Updater"
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/Current/XPCServices"
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/Current/XPCServices/Installer.xpc"
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/Current/XPCServices/Installer.xpc/Contents/MacOS/Installer"
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/Current/_CodeSignature/CodeResources"
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/Current/Updater.app/Contents/_CodeSignature/CodeResources"
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/Current/XPCServices/Installer.xpc/Contents/_CodeSignature/CodeResources"
          - "$(TARGET_TEMP_DIR)/QotaFolio-Sparkle-v3-$(WRAPPER_NAME)-$(CONFIGURATION)-$(ACTION)-$(CODE_SIGNING_ALLOWED)-$(EXPANDED_CODE_SIGN_IDENTITY).stamp"
        script: |
          set -euo pipefail
          phase_version="3"
          source_framework="${BUILT_PRODUCTS_DIR}/Sparkle.framework"
          framework="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/Sparkle.framework"
          versions="${framework}/Versions"
          current="${versions}/Current"
          stamp_file="${SCRIPT_OUTPUT_FILE_12}"

          if [ ! -d "${source_framework}" ]; then
            printf '%s\n' "Missing resolved Sparkle framework: ${source_framework}" >&2
            exit 1
          fi
          mkdir -p "$(/usr/bin/dirname "${framework}")"
          rm -rf "${framework}"
          /usr/bin/ditto "${source_framework}" "${framework}"

          if [ ! -d "${current}" ]; then
            printf '%s\n' "Missing Sparkle current-version layout: ${current}" >&2
            exit 1
          fi
          versions_dir="$(cd "${versions}" && /bin/pwd -P)"
          version_dir="$(cd "${current}" && /bin/pwd -P)"
          if [ "$(/usr/bin/dirname "${version_dir}")" != "${versions_dir}" ]; then
            printf '%s\n' "Sparkle Versions/Current resolves outside Versions: ${version_dir}" >&2
            exit 1
          fi

          /usr/bin/find "${framework}" -name Downloader.xpc -prune -exec /bin/rm -rf {} +
          if /usr/bin/find "${framework}" -name Downloader.xpc -print -quit | /usr/bin/grep -q .; then
            printf '%s\n' "Sparkle Downloader.xpc remains after pruning" >&2
            exit 1
          fi

          identity_name="${EXPANDED_CODE_SIGN_IDENTITY_NAME:-${CODE_SIGN_IDENTITY:-}}"
          timestamp_mode="unsigned"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ]; then
            if [ -z "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
              printf '%s\n' "Missing expanded code-sign identity for Sparkle signing" >&2
              exit 1
            fi
            case "${identity_name}" in
              Developer\ ID\ Application*) timestamp_flag="--timestamp"; timestamp_mode="secure" ;;
              Apple\ Development*) timestamp_flag="--timestamp=none"; timestamp_mode="none" ;;
              *)
                printf '%s\n' "Unsupported Sparkle signing identity mode: ${identity_name:-<empty>}" >&2
                exit 1
                ;;
            esac

            sign_code() {
              code="$1"
              if [ ! -e "${code}" ]; then
                printf '%s\n' "Missing required Sparkle code object: ${code}" >&2
                exit 1
              fi
              /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
                --options runtime "${timestamp_flag}" \
                --preserve-metadata=identifier,entitlements,requirements \
                "${code}"
              /usr/bin/codesign --verify --strict --verbose=2 "${code}"
            }

            # Sparkle's documented manual order is Installer, Autoupdate, Updater, then framework.
            sign_code "${version_dir}/XPCServices/Installer.xpc"
            sign_code "${version_dir}/Autoupdate"
            sign_code "${version_dir}/Updater.app"
            sign_code "${framework}"
            /usr/bin/codesign --verify --deep --strict --verbose=2 "${framework}"
          fi

          /usr/bin/touch \
            "${version_dir}/Sparkle" \
            "${version_dir}/Autoupdate" \
            "${version_dir}/Updater.app/Contents/MacOS/Updater" \
            "${version_dir}/Updater.app/Contents/_CodeSignature/CodeResources" \
            "${version_dir}/XPCServices/Installer.xpc/Contents/MacOS/Installer" \
            "${version_dir}/XPCServices/Installer.xpc/Contents/_CodeSignature/CodeResources" \
            "${version_dir}/XPCServices/Installer.xpc" \
            "${version_dir}/XPCServices" \
            "${version_dir}/Updater.app" \
            "${version_dir}/_CodeSignature/CodeResources" \
            "${framework}"
          /usr/bin/touch -h "${current}"

          mkdir -p "$(/usr/bin/dirname "${stamp_file}")"
          /usr/bin/xcrun python3 - "${stamp_file}" "${source_framework}" "${framework}" \
            "${phase_version}" "${CONFIGURATION}" "${ACTION}" \
            "${CODE_SIGNING_ALLOWED:-YES}" "${EXPANDED_CODE_SIGN_IDENTITY:-}" \
            "${identity_name}" "${timestamp_mode}" <<'PYTHON'
          import hashlib
          import os
          import sys
          from pathlib import Path

          (stamp_path, source_root, destination_root, phase_version,
           configuration, action, signing_allowed, identity,
           identity_name, timestamp_mode) = sys.argv[1:]

          def tree_digest(root: str):
              root_path = Path(root)
              digest = hashlib.sha256()
              entries = [root_path]
              for current, directories, files in os.walk(root_path, followlinks=False):
                  current_path = Path(current)
                  entries.extend(current_path / name for name in sorted(directories))
                  entries.extend(current_path / name for name in sorted(files))
              for path in entries:
                  relative = "." if path == root_path else path.relative_to(root_path).as_posix()
                  if path.is_symlink():
                      kind = "symlink"
                      payload = os.readlink(path).encode()
                  elif path.is_dir():
                      kind = "directory"
                      payload = b""
                  elif path.is_file():
                      kind = "file"
                      payload = path.read_bytes()
                  else:
                      kind = "other"
                      payload = b""
                  digest.update(kind.encode() + b"\0" + relative.encode() + b"\0")
                  digest.update(payload)
                  digest.update(b"\0")
              return digest.hexdigest()

          stamp_text = "\n".join([
              f"phase_version={phase_version}",
              f"source={source_root}",
              f"source_sha256={tree_digest(source_root)}",
              f"destination={destination_root}",
              f"destination_sha256={tree_digest(destination_root)}",
              f"configuration={configuration}",
              f"action={action}",
              f"code_signing_allowed={signing_allowed}",
              f"expanded_code_sign_identity={identity}",
              f"identity_name={identity_name}",
              f"timestamp_mode={timestamp_mode}",
              "downloader_present=false",
              "",
          ])
          stamp_tmp = Path(stamp_path + ".tmp")
          stamp_tmp.write_text(stamp_text)
          stamp_tmp.replace(stamp_path)
          PYTHON

schemes:
  QotaFolio:
    build: { targets: { QotaFolio: all } }
