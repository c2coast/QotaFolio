          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/Current"
          - "$(BUILT_PRODUCTS_DIR)/Sparkle.framework/Versions/B/Headers"
