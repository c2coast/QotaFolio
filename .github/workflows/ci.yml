# This repo's whole CI: the org's one check, run from c2coast/ci's main. Every repo carries
# exactly this file; the required check it reports is `ci / check`. pull_request_target runs the
# copy of this file on the default branch, so a branch cannot replace the check that judges it;
# `edited` runs it again when a pull request's base changes.
name: ci
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  ci:
    uses: c2coast/ci/.github/workflows/check.yml@main
