# Proof that the tree assembles: the project generates and every target compiles with no
# signing identity anywhere.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Pinned to the macOS line the app requires, rather than macos-latest, which moves.
    # The image's default Xcode is a 26.x, which is what the project is written against.
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The runner has no XcodeGen, and the repository tracks no generated project.
      - run: brew install xcodegen
      - run: xcodegen generate --no-env --spec project.yml --project . --project-root .

      - name: Compile every target
        run: |
          xcodebuild -project QotaFolio.xcodeproj -scheme QotaFolio -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet build
